name: ci

# Pull requests and pushes to main run the same checks as publish-dist,
# without publishing. Replaces the old manual verification workflow.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PUBLIC_REPO: ahuai6/Sub-Store-Fork

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Run publish checks
        env:
          PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        run: bash .github/scripts/run_fork_publish_checks.sh "$GITHUB_WORKSPACE"
