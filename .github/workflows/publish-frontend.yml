name: publish-frontend

# Build sub-store-org/Sub-Store-Front-End and push it to this repository's
# gh-pages branch. Upstream's dist.zip uses Vite base `/` and a PWA scope of
# `/`, which 404 on a GitHub Pages project site, so this builds from source
# with base /Sub-Store-Fork/ and VITE_API_URL=https://sub.store.
#
# The latest release commit is built when it is master (or master is behind
# it). Master is built when it has commits the latest release does not,
# because upstream only releases when package.json changes.
#
# frontend-version.txt records a patch stamp from prepare_frontend_pages.py.
# A new stamp rebuilds even when the upstream sha, base, and API URL match.
# workflow_dispatch input force=true rebuilds regardless.
#
# The site directory is pushed from this job onto gh-pages. Nothing is
# uploaded as an Actions artifact. The push is not a force-push and does not
# touch main.
on:
  schedule:
    # Daily, after sync-upstream (04:17 UTC), on its own minute.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push even when this commit is already deployed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-frontend
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  FORCE: ${{ github.event.inputs.force == 'true' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve front-end commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve_frontend_ref.sh

      - name: Skip when this commit is already deployed
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" == "true" ]]; then
            echo "Force requested. Building ${{ steps.resolve.outputs.sha }}."
            exit 0
          fi
          expected_base=$(python3 .github/scripts/prepare_frontend_pages.py --print-base)
          if [[ -z "$expected_base" || "$expected_base" == *$'\n'* || "$expected_base" == "/" ]]; then
            echo "::error::base from prepare_frontend_pages.py is empty, multiline, or /"
            exit 1
          fi
          set +e
          raw=$(gh api "repos/${GITHUB_REPOSITORY}/contents/frontend-version.txt?ref=gh-pages" --jq .content 2>/tmp/pages-version.err)
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            echo "No deployed frontend-version.txt yet."
            exit 0
          fi
          text=$(printf '%s' "$raw" | tr -d '\n' | base64 -d)
          deployed_sha=$(printf '%s\n' "$text" | awk -F= '$1=="sha"{print $2}')
          deployed_base=$(printf '%s\n' "$text" | awk -F= '$1=="base"{print $2}')
          deployed_api=$(printf '%s\n' "$text" | awk -F= '$1=="api"{print $2}')
          deployed_patches=$(printf '%s\n' "$text" | awk -F= '$1=="patches"{print $2}')
          expected_patches=$(python3 .github/scripts/prepare_frontend_pages.py --print-patch-stamp)
          if [[ -z "$expected_patches" || "$expected_patches" == *$'\n'* ]]; then
            echo "::error::patch stamp from prepare_frontend_pages.py is empty or multiline"
            exit 1
          fi
          pages_url="https://ahuai6.github.io${expected_base}"
          if [[ "$deployed_sha" == "${{ steps.resolve.outputs.sha }}" \
            && "$deployed_base" == "$expected_base" \
            && "$deployed_api" == "https://sub.store" \
            && "$deployed_patches" == "$expected_patches" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Front end already deployed"
              echo ""
              echo "\`${deployed_sha}\` is already on \`gh-pages\` with the Pages base, \`https://sub.store\`, and patch stamp \`${expected_patches}\`."
              echo ""
              echo "${pages_url}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployed sha=${deployed_sha:-<none>} base=${deployed_base:-<none>} patches=${deployed_patches:-<none>} -> sha=${{ steps.resolve.outputs.sha }} base=${expected_base} patches=${expected_patches}"
          fi

      - name: Checkout front end
        if: steps.deployed.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: ${{ steps.resolve.outputs.sha }}
          path: frontend

      - name: Set up Node.js
        if: steps.deployed.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version

      - name: Patch the Pages base and PWA scope
        if: steps.deployed.outputs.skip != 'true'
        run: |
          python3 .github/scripts/prepare_frontend_pages.py \
            --patch \
            --frontend-dir frontend

      - name: Install and build
        if: steps.deployed.outputs.skip != 'true'
        env:
          VITE_API_URL: https://sub.store
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Add license, attribution, and SPA fallback
        if: steps.deployed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          package=$(node -p "require('./frontend/package.json').version")
          python3 .github/scripts/prepare_frontend_pages.py \
            --finalize-site \
            --dist frontend/dist \
            --frontend-dir frontend \
            --sha "${{ steps.resolve.outputs.sha }}" \
            --track "${{ steps.resolve.outputs.track }}" \
            --release-tag "${{ steps.resolve.outputs.release_tag }}" \
            --release-sha "${{ steps.resolve.outputs.release_sha }}" \
            --package "$package"

      - name: Publish gh-pages
        if: steps.deployed.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_frontend_pages.sh "${PWD}/frontend/dist"
