name: sync-upstream

# Fast-forward the pristine `upstream` branch to sub-store-org/Sub-Store master,
# mirror new tags, and merge that into `main`. A conflict opens a PR. After a
# clean merge, the fork frontend redirect and CORS origin are reapplied; if
# that patch no longer matches, main is not pushed and the diagnostic report is
# written to the Job Summary (repository Issues stay disabled).
# Publish checks run before main is pushed. A check failure opens a PR on
# sync/tests-failed. This workflow never force-pushes and never deletes branches.
#
# Git identity is set before `git merge`. Runners have no committer identity,
# and current git refuses the merge with "fatal: empty ident name" before it
# records conflicts.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  GIT_TERMINAL_PROMPT: "0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  PUBLIC_REPO: ahuai6/Sub-Store-Fork

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/sub-store-org/Sub-Store.git
          git fetch upstream master --tags --prune --force

      - name: Fast-forward upstream branch
        run: |
          set -euo pipefail
          # git push has no --ff-only. Confirm the remote tip is an ancestor, then
          # push without --force. A rejected non-fast-forward still fails the step.
          target_sha=$(git rev-parse upstream/master)
          if git ls-remote --exit-code --heads origin upstream >/dev/null; then
            # Fetch into a throwaway ref so a stale local tip cannot reject the read.
            git update-ref -d refs/tmp/sync-upstream-tip 2>/dev/null || true
            git fetch --no-tags origin refs/heads/upstream:refs/tmp/sync-upstream-tip
            remote_sha=$(git rev-parse refs/tmp/sync-upstream-tip)
          else
            remote_sha=""
          fi
          if [ -z "$remote_sha" ]; then
            echo "Creating refs/heads/upstream at ${target_sha}"
          elif [ "$remote_sha" = "$target_sha" ]; then
            echo "refs/heads/upstream is already ${target_sha}"
          elif git merge-base --is-ancestor "$remote_sha" "$target_sha"; then
            echo "Fast-forward ${remote_sha} -> ${target_sha}"
          else
            echo "::error::Refusing to force-update refs/heads/upstream (${remote_sha} is not an ancestor of ${target_sha})."
            exit 1
          fi
          git push origin "${target_sha}:refs/heads/upstream"

      - name: Mirror new upstream tags
        run: |
          set -euo pipefail
          # Tags already on origin are left where they are, even if upstream moved them.
          git ls-remote --tags origin | awk '{print $2}' | sed 's/\^{}$//' | sort -u > /tmp/origin-tags
          refs=()
          while read -r _sha ref; do
            case "$ref" in
              refs/tags/*\^\{\}) continue ;;
              refs/tags/*) ;;
              *) continue ;;
            esac
            if ! grep -Fxq "$ref" /tmp/origin-tags; then
              refs+=("${ref}:${ref}")
            fi
          done < <(git ls-remote --tags upstream)
          if [ ${#refs[@]} -eq 0 ]; then
            echo "No new upstream tags."
          else
            echo "Pushing ${#refs[@]} new tag(s)."
            git push origin "${refs[@]}"
          fi

      - name: Merge upstream into main
        id: merge
        run: |
          set -euo pipefail
          git checkout main
          # Runners have no committer identity. Git 2.56 refuses `git merge`
          # before it writes the index (`fatal: empty ident name`), and
          # `git diff --diff-filter=U` is then empty. The conflict PR used to
          # publish that blank list. Set the same bot identity used for commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          set +e
          git merge --no-edit upstream/master > /tmp/merge-output.txt 2>&1
          code=$?
          set -e
          cat /tmp/merge-output.txt
          if [ "$code" -ne 0 ]; then
            # One path per unmerged index stage. This stays empty when merge
            # exits before recording conflicts; the PR/issue body says so.
            git ls-files -u --format='%(path)' | sort -u > /tmp/conflict-files || true
            if [ -s /tmp/conflict-files ]; then
              echo "conflicts=true" >> "$GITHUB_OUTPUT"
              echo "Unmerged files:"
              cat /tmp/conflict-files
            else
              echo "conflicts=false" >> "$GITHUB_OUTPUT"
              cp /tmp/merge-output.txt /tmp/merge-error.txt
              echo "Merge failed before any unmerged paths were recorded."
            fi
            git merge --abort || true
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "clean=true"
            echo "conflicts=false"
            echo "before=${before}"
            echo "after=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Reapply fork frontend customizations
        id: fork
        if: steps.merge.outputs.clean == 'true'
        run: |
          set -euo pipefail
          if ! node .github/scripts/apply-fork-frontend.mjs > /tmp/fork-patch.txt 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! node .github/scripts/apply-fork-runtime.mjs --check >> /tmp/fork-patch.txt 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat /tmp/fork-patch.txt
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- backend/src/restful/miscs.js backend/src/utils/cors.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/src/restful/miscs.js backend/src/utils/cors.js
            git commit -m "reapply fork frontend redirect and CORS origin"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a fork patch that no longer applies
        if: steps.merge.outputs.clean == 'true' && steps.fork.outputs.ok != 'true'
        run: |
          set -euo pipefail
          {
            echo "### sync: fork frontend patch no longer applies"
            echo
            echo "Automatic merge of \`sub-store-org/Sub-Store\` \`master\` into \`main\` was clean, but the fork frontend patch no longer matches. \`main\` was not pushed. Nothing was force-pushed."
            echo
            echo "\`node .github/scripts/apply-fork-frontend.mjs\` or \`node .github/scripts/apply-fork-runtime.mjs --check\` failed:"
            echo
            echo '```'
            cat /tmp/fork-patch.txt
            echo '```'
            echo
            echo "Keep these customizations:"
            echo
            echo "- \`backend/src/restful/miscs.js\` redirects \`/\` to \`https://ahuai6.github.io/Sub-Store-Fork/\`."
            echo "- \`backend/src/utils/cors.js\` keeps \`https://ahuai6.github.io\` on \`NON_NODE_CORS_DEFAULT\`."
            echo
            echo "Upstream commit: \`$(git rev-parse upstream/master)\`"
          } > /tmp/fork-patch-report.md
          cat /tmp/fork-patch-report.md
          cat /tmp/fork-patch-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Fork patch no longer applies::Upstream merge was clean, but fork patch verification failed. main was not pushed; see Job Summary."
          exit 1

      - name: Refresh the published Surge module
        id: module
        if: steps.merge.outputs.clean == 'true' && steps.fork.outputs.ok == 'true' && (steps.merge.outputs.before != steps.merge.outputs.after || steps.fork.outputs.changed == 'true')
        run: |
          set -euo pipefail
          python3 .github/scripts/render_surge_beta_module.py \
            --check \
            --public-repo "$PUBLIC_REPO" \
            --output dist/Surge-Beta.sgmodule >/tmp/module.diff
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- dist/Surge-Beta.sgmodule; then
            echo "Published Surge module already matches the renderer."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/Surge-Beta.sgmodule
            git commit -m "refresh published Surge beta module"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.merge.outputs.clean == 'true' && steps.fork.outputs.ok == 'true' && (steps.merge.outputs.before != steps.merge.outputs.after || steps.fork.outputs.changed == 'true')
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Run publish checks before pushing main
        id: tests
        if: steps.merge.outputs.clean == 'true' && steps.fork.outputs.ok == 'true' && (steps.merge.outputs.before != steps.merge.outputs.after || steps.fork.outputs.changed == 'true')
        env:
          PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        run: |
          set +e
          set -o pipefail
          bash .github/scripts/run_fork_publish_checks.sh "$GITHUB_WORKSPACE" | tee /tmp/fork-checks.txt
          code=$?
          set -e
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Open a PR when the checks fail
        if: always() && steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("/tmp/fork-checks.txt")
          text = log.read_text(errors="replace") if log.exists() else "(no log)"
          tail = "\n".join(text.splitlines()[-80:]).replace("```", "'''")
          tail = re.sub(r"https://[^@\s/]+@", "https://[redacted]@", tail)
          tail = re.sub(r"(github_pat_|ghs_|ghp_|x-access-token:)[A-Za-z0-9_]+", r"\1[redacted]", tail)
          Path("/tmp/fork-checks-tail.txt").write_text(tail)
          PY
          pushed=false
          if git push origin "HEAD:refs/heads/sync/tests-failed"; then
            pushed=true
          else
            echo "Could not fast-forward sync/tests-failed. Not force-pushing."
          fi
          {
            echo "Automatic merge of \`sub-store-org/Sub-Store\` \`master\` into \`main\` was clean, but the publish checks failed. \`main\` was not pushed. Nothing was force-pushed."
            echo
            if [ "$pushed" = "true" ]; then
              echo "The merge is on \`sync/tests-failed\`."
            else
              echo "\`sync/tests-failed\` was not updated because that push was not a fast-forward."
            fi
            echo
            echo "Upstream commit: \`$(git rev-parse upstream/master)\`"
            echo
            echo "Last lines of the checks:"
            echo
            echo '```'
            cat /tmp/fork-checks-tail.txt
            echo '```'
          } > /tmp/sync-tests-body.md
          {
            echo "### sync: upstream merge checks failed"
            echo
            cat /tmp/sync-tests-body.md
          } >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head sync/tests-failed --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/sync-tests-body.md
            exit 0
          fi
          if [ "$pushed" != "true" ]; then
            echo "::error title=sync/tests-failed needs manual attention::Publish checks failed and sync/tests-failed could not fast-forward. See Job Summary."
            exit 1
          fi
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head sync/tests-failed --title "sync: upstream merge checks failed" --body-file /tmp/sync-tests-body.md; then
            echo "::error title=Failed to create sync/tests-failed PR::Publish checks failed and sync/tests-failed was pushed, but PR creation failed. See Job Summary."
            exit 1
          fi

      - name: Push main
        id: push
        if: steps.merge.outputs.clean == 'true' && steps.fork.outputs.ok == 'true' && steps.module.outcome != 'failure' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'skipped')
        run: |
          set -euo pipefail
          git push origin main
          if [ "${{ steps.merge.outputs.before }}" != "${{ steps.merge.outputs.after }}" ] || [ "${{ steps.fork.outputs.changed }}" = "true" ] || [ "${{ steps.module.outputs.changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_ENV"
          else
            echo "changed=false" >> "$GITHUB_ENV"
          fi

      - name: Close an open conflict PR after a clean merge
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head sync/upstream --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment "Upstream merged into main cleanly, so this conflict PR is no longer needed."
          fi

      - name: Close an open test-failure PR after the checks pass
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head sync/tests-failed --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment "The publish checks passed and main was updated, so this test-failure PR is no longer needed."
          fi

      - name: Publish when the backend version or fork patch changes
        if: steps.push.outcome == 'success' && env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_CHANGED: ${{ steps.fork.outputs.changed }}
          MODULE_CHANGED: ${{ steps.module.outputs.changed }}
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN does not start the push-triggered
          # workflows. Dispatch publish-dist when the release version, the
          # fork redirect/CORS patch, or the published module changed. Other
          # main commits are published by the schedule once their SHA differs
          # from the Built from line in the latest Release notes.
          publish=false
          if git diff --name-only "${{ steps.merge.outputs.before }}" "${{ steps.merge.outputs.after }}" | grep -qx 'backend/package.json'; then
            publish=true
          fi
          if [ "$FORK_CHANGED" = "true" ] || [ "$MODULE_CHANGED" = "true" ]; then
            publish=true
          fi
          if [ "$publish" = "true" ]; then
            gh workflow run publish-dist.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "No package.json bump and no fork patch or module commit. The publish-dist schedule publishes other main SHAs."
          fi

      - name: Open a PR when the merge conflicts
        if: steps.merge.outputs.clean != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The PR head is upstream/master itself. Resolving happens on the PR.
          # Do not force this branch if someone already pushed a resolution.
          if [ "${{ steps.merge.outputs.conflicts }}" != "true" ]; then
            {
              echo "### sync: upstream merge failed before conflicts were recorded"
              echo
              echo "Automatic merge of \`sub-store-org/Sub-Store\` \`master\` into \`main\` failed before any conflicts were recorded. Nothing was force-pushed, and \`sync/upstream\` was not updated."
              echo
              echo "\`git merge\` output:"
              echo
              echo '```'
              cat /tmp/merge-error.txt
              echo '```'
              echo
              echo "Upstream commit: \`$(git rev-parse upstream/master)\`"
            } > /tmp/sync-pr-body.md
            cat /tmp/sync-pr-body.md
            cat /tmp/sync-pr-body.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Upstream merge failed before conflicts were recorded::See Job Summary for git merge output."
            exit 1
          fi
          if ! git push origin upstream/master:refs/heads/sync/upstream; then
            {
              echo "### sync: upstream merge conflicts need attention"
              echo
              echo "Could not update \`sync/upstream\` (it is not a fast-forward). Upstream commit: \`$(git rev-parse upstream/master)\`."
              echo
              echo "Conflicting files:"
              echo
              echo '```'
              cat /tmp/conflict-files
              echo '```'
              echo
              echo "Keep the fork redirect in \`backend/src/restful/miscs.js\` (\`https://ahuai6.github.io/Sub-Store-Fork/\`) and \`https://ahuai6.github.io\` on \`NON_NODE_CORS_DEFAULT\` in \`backend/src/utils/cors.js\`. \`node .github/scripts/apply-fork-frontend.mjs\` reapplies both when the anchors still match. Nothing was force-pushed."
            } > /tmp/sync-conflict-attention.md
            cat /tmp/sync-conflict-attention.md
            cat /tmp/sync-conflict-attention.md >> "$GITHUB_STEP_SUMMARY"
            existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head sync/upstream --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh pr comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/sync-conflict-attention.md
            fi
            echo "::error title=sync/upstream could not fast-forward::Upstream merge conflicts need manual attention. See Job Summary."
            exit 1
          fi
          {
            echo "Automatic merge of \`sub-store-org/Sub-Store\` \`master\` into \`main\` hit conflicts. Nothing was force-pushed."
            echo
            echo "The \`upstream\` branch was fast-forwarded and is still a pristine copy of upstream \`master\`."
            echo
            echo "Conflicting files:"
            echo
            echo '```'
            cat /tmp/conflict-files
            echo '```'
            echo
            echo "Upstream commit: \`$(git rev-parse upstream/master)\`"
            echo
            echo "Fork customizations that must be kept:"
            echo
            echo "- \`backend/src/restful/miscs.js\` redirects \`/\` to \`https://ahuai6.github.io/Sub-Store-Fork/\`."
            echo "- \`backend/src/utils/cors.js\` keeps \`https://ahuai6.github.io\` on \`NON_NODE_CORS_DEFAULT\`."
            echo "- Run \`node .github/scripts/apply-fork-frontend.mjs\` and commit the result when the anchors still match."
            echo "- Refresh \`dist/Surge-Beta.sgmodule\` with \`render_surge_beta_module.py\` when the upstream module changed."
            echo
            echo "Resolve the conflicts on this PR with a merge commit. Do not squash, rebase, or force-push \`main\` or \`upstream\`."
          } > /tmp/sync-pr-body.md
          {
            echo "### sync: resolve upstream merge conflicts"
            echo
            cat /tmp/sync-pr-body.md
          } >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head sync/upstream --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/sync-pr-body.md
            exit 0
          fi
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head sync/upstream --title "sync: resolve upstream merge conflicts" --body-file /tmp/sync-pr-body.md; then
            echo "::error title=Failed to create sync/upstream PR::Conflict branch sync/upstream was pushed, but PR creation failed. See Job Summary."
            exit 1
          fi
